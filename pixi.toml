[workspace]
name = "yarp-device-openxrheadset"
version = "0.0.10"
description = "OpenXR headset YARP device driver packaged with pixi."
channels = ["conda-forge", "https://prefix.dev/robotology"]
platforms = ["win-64"]
preview = ["pixi-build"]

[tasks]
build-package = "pixi build --output-dir dist"
run-device = { cmd = "yarpdev --device openxrheadset", depends-on = ["build-package"] }

[package]
name = { workspace = true }
version = { workspace = true }
description = { workspace = true }
license = "BSD-2-Clause"
license-file = "LICENSE"
readme = "README.md"
repository = "https://github.com/hsp-iit/yarp-device-openxrheadset"

[package.build]
backend = {
  name = "pixi-build-cmake",
  version = "0.3.*",
  channels = [
    "https://prefix.dev/pixi-build-backends",
    "conda-forge",
    "https://prefix.dev/robotology",
  ],
}

[activation]
scripts = ["activate-yarp.bat"]

[package.build-dependencies]
git = "*"

[package.host-dependencies]
# Do not add `yarp = "*"` here until a YARP 4 conda package is available.
# The released `yarp` package still resolves to YARP 3 on win-64.
eigen = "*"
freetype = "*"
glew = "*"
glfw = "*"
glm = "*"
idyntree = "*"
openxr-sdk = "*"
ycm-cmake-modules = "*"

[package.run-dependencies]
# Keep YARP out of package run dependencies until a YARP 4 package is available.
idyntree = "*"
openxr-sdk = "*"

[dependencies]
git = ">=2.55.0,<3"
cmake = ">=4.4.0,<5"
ninja = ">=1.13.2,<2"
compilers = ">=1.11.0,<2"
pkg-config = ">=0.29.2,<0.30"
make = ">=4.4.1,<5"
ycm-cmake-modules = ">=0.18.5,<0.19"
ace = ">=8.0.6,<9"
tinyxml = ">=2.6.2,<3"
eigen = ">=5.0.1,<6"
freetype = ">=2.14.3,<3"
glew = ">=2.2.0,<3"
glfw = ">=3.4,<4"
glm = ">=1.0.1,<2"
idyntree = "*"
openxr-sdk = ">=1.0.20,<2"
sdl = ">=1.2.68,<2"
sqlite = ">=3.53.3,<4"
libjpeg-turbo = ">=3.2.0,<4"
robot-testing-framework = ">=2.0.1,<3"
libpng = ">=1.6.58,<2"
libzlib = ">=1.3.2,<2"
soxr = ">=0.1.3,<0.2"
libopencv = ">=5.0.0,<6"
portaudio = ">=19.7.0,<20"
qt-main = ">=5.15.15,<6"
ffmpeg = ">=8.1.2,<9"
python = ">=3.14.6,<3.15"
swig = ">=4.4.1,<5"

[package.build.config]
compilers = ["cxx"]
extra-args = [
  "-DCMAKE_BUILD_TYPE=Release",
  "-DBUILD_TESTING=OFF",
]
extra-input-globs = [
  "CMakeLists.txt",
  "LICENSE",
  "README.md",
  "src/**/CMakeLists.txt",
  "src/**/*.cpp",
  "src/**/*.h",
  "src/**/*.h.in",
  "src/**/*.jpg",
  "src/**/*.png",
  "src/**/*.shader",
  "src/**/*.thrift",
]
